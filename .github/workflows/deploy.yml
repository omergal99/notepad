name: Test and Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    steps:
      - name: Test Summary
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║    NOTEPAD ONLINE CI/CD REPORT        ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "✅ Test Status:      ${{ needs.test.result }}"
          echo "✅ Build Status:     ${{ needs.build.result }}"
          echo "✅ Lint Status:      ${{ needs.lint.result }}"
          echo "✅ Security Status:  ${{ needs.security.result }}"
          echo "✅ Accessibility:    ${{ needs.accessibility.result }}"
          echo "✅ Performance:      ${{ needs.performance.result }}"
          echo ""
          echo "📊 Summary:"
          echo "   - Phase: 2 (StorageEngine Enhancement)"
          echo "   - Tests: Running automatically on push"
          echo "   - Coverage: Tracked per phase"
          echo ""
          echo "🔗 Actions: https://github.com/${{ github.repository }}/actions"
